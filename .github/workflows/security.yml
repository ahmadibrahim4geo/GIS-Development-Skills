name: GIS Security Guardian
on:
  # Validate only main pushes. Feature branches are tested via pull_request.
  # Avoid duplicate push + PR checks (and duplicate email notifications).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Keep the latest run per branch/PR. Fast successive commits should not
# generate a backlog of obsolete failing checks and notifications.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  security-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (pinned action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Python 3.11 (pinned action)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node.js 24
        with:
          python-version: '3.11'
      - name: Offline GIS Security Guardian preflight
        run: python scripts/security_audit.py --root . --format text
      - name: Security guard unit tests
        run: python -m unittest discover -s tests -p 'test_security_guardian.py' -v
      - name: Source inventory and skill links
        run: |
          python scripts/validate_skill_pack.py
          python scripts/build_manifest.py --check

name: Validate GIS Skill
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Catalog and skill checks
        run: |
          python scripts/validate_catalog.py
          python scripts/validate_api_catalog.py
          python scripts/validate_skill_pack.py
          python scripts/build_manifest.py --check
          python scripts/validate_evidence.py templates/gis-acceptance.example.json
          python -m unittest discover -s tests -v
          python -m py_compile templates/arcmap-script-tool.py templates/arcgis-pro-toolbox.pyt templates/qgis-processing-algorithm.py templates/standalone-geojson-summary.py
          python -m py_compile examples/network-topology/audit_network.py examples/api-ingestion/weather_to_geojson.py examples/batch-export/export_layouts_arcgis_pro.py          python -m py_compile scripts/build_manifest.py scripts/validate_evidence.py scripts/monitor_public_services.py scripts/benchmark_gis_examples.py fixtures/generate_binary_fixtures.py native_tests/arcgis_pro_acceptance.py native_tests/qgis_acceptance.py

name: Validate GIS Skill
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate project catalog
        run: python scripts/validate_catalog.py
      - name: Audit recorded upstream license evidence
        run: python scripts/audit_license_catalog.py --summary
      - name: Offline GIS Security Guardian preflight
        run: python scripts/security_audit.py --root . --format text
      - name: Validate API catalog
        run: python scripts/validate_api_catalog.py
      - name: Validate GIS data repositories index
        run: python scripts/validate_data_repositories.py
      - name: Validate skill pack and local links
        run: python scripts/validate_skill_pack.py
      - name: Check generated manifest and counters
        run: python scripts/build_manifest.py --check
      - name: Validate acceptance evidence example
        run: python scripts/validate_evidence.py templates/gis-acceptance.example.json
      - name: Validate inline website JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; t=Path('index.html').read_text(encoding='utf-8'); m=re.search(r'<script>(.*?)</script>',t,flags=re.S); assert m; Path('site-inline-check.js').write_text(m.group(1),encoding='utf-8')"
          node --check site-inline-check.js
          rm site-inline-check.js
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check GIS templates
        run: |
          python -m py_compile templates/arcmap-script-tool.py templates/arcgis-pro-toolbox.pyt templates/qgis-processing-algorithm.py templates/standalone-geojson-summary.py
      - name: Syntax check production examples
        run: |
          python -m py_compile examples/network-topology/audit_network.py examples/data-catalogs/search_sources.py examples/stac-offline/inspect_items.py examples/terrain-slope/slope_ascii.py examples/api-ingestion/weather_to_geojson.py examples/batch-export/export_layouts_arcgis_pro.py
      - name: Syntax check helpers and native acceptance scripts
        run: |
          python -m py_compile scripts/development_journal.py scripts/build_manifest.py scripts/audit_license_catalog.py scripts/validate_data_repositories.py scripts/validate_evidence.py scripts/monitor_public_services.py scripts/benchmark_gis_examples.py fixtures/generate_binary_fixtures.py native_tests/arcgis_pro_acceptance.py native_tests/qgis_acceptance.py

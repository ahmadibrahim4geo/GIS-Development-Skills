<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIS Project Wizard</title>
<style>:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#0b1418;color:#eef6f2}body{max-width:850px;margin:auto;padding:24px}main{background:#142329;border:1px solid #355057;border-radius:18px;padding:24px}label{display:block;margin:15px 0 5px}select,textarea,button{font:inherit;background:#1c343b;color:inherit;border:1px solid #607a7e;border-radius:8px;padding:10px;width:100%}button{cursor:pointer;margin-top:12px;background:#345b53}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b4eb91}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#081216;padding:16px;border-radius:8px}a{color:#b4eb91}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.top button{width:auto}</style></head>
<body><div class="top"><h1 id="heading">GIS Project Wizard</h1><button id="lang" type="button">العربية</button></div><main><p id="intro">Build a free-first, testable GIS project plan.</p>
<label for="type" id="typeLabel">Project type</label><select id="type"><option value="desktop">Desktop GIS</option><option value="pro">ArcGIS Pro Toolbox</option><option value="arcmap">ArcMap Toolbox</option><option value="dual">ArcGIS Pro + ArcMap Toolbox</option><option value="qgis">QGIS Plugin</option><option value="web">Web GIS</option><option value="remote">Remote Sensing</option><option value="database">Spatial Database</option><option value="geoai">GeoAI</option></select>
<label for="locale" id="localeLabel">Application languages</label><select id="locale"><option value="ar-en">Arabic + English</option><option value="en">English only</option><option value="multi">Multilingual (Arabic, English, French and others)</option></select>\n<label for="files" id="filesLabel">KML/KMZ support</label><select id="files"><option value="yes">Required</option><option value="no">Not required</option></select>
<label for="license" id="licenseLabel">Licensing preference</label><select id="license"><option value="free">Free/open-source components first</option><option value="host">Existing commercial GIS host allowed</option></select>
<label for="details" id="detailsLabel">What should your project do?</label><textarea id="details" rows="4" maxlength="4000" placeholder="Describe the desired features"></textarea>
<button id="generate" type="button">Generate plan</button><button id="download" type="button" disabled>Download Markdown</button>
<h2 id="resultLabel">Project plan</h2><pre id="result" aria-live="polite"></pre>
<p><a href="docs/PROJECT_WIZARD_PLAN.md">Implementation roadmap</a> · <a href="skills/kml-kmz-engineering/SKILL.md">KML/KMZ skill</a> · <a href="docs/PERFORMANCE_RELIABILITY.md">Reliability guide</a></p></main>
<script>
const $=id=>document.getElementById(id);let ar=false,output='';
const dict={en:{heading:'GIS Project Wizard',intro:'Build a free-first, testable GIS project plan.',typeLabel:'Project type',localeLabel:'Application languages',filesLabel:'KML/KMZ support',licenseLabel:'Licensing preference',detailsLabel:'What should your project do?',generate:'Generate plan',download:'Download Markdown',resultLabel:'Project plan',lang:'العربية',placeholder:'Describe the desired features',yes:'Required',no:'Not required',free:'Free/open-source components first',host:'Existing commercial GIS host allowed'},ar:{heading:'معالج مشاريع نظم المعلومات الجغرافية',intro:'أنشئ خطة مشروع قابلة للاختبار مع إعطاء الأولوية للمكونات المجانية.',typeLabel:'نوع المشروع',localeLabel:'لغات التطبيق',filesLabel:'دعم KML وKMZ',licenseLabel:'تفضيل الترخيص',detailsLabel:'ما الوظائف المطلوبة في المشروع؟',generate:'إنشاء الخطة',download:'تنزيل Markdown',resultLabel:'خطة المشروع',lang:'English',placeholder:'اكتب الوظائف المطلوبة',yes:'مطلوب',no:'غير مطلوب',free:'المكونات المجانية ومفتوحة المصدر أولاً',host:'السماح ببرنامج GIS تجاري متوفر'}};
const localeLabels={en:{'ar-en':'Arabic + English',en:'English only',multi:'Multilingual (Arabic, English, French and others)'},ar:{'ar-en':'العربية والإنجليزية',en:'الإنجليزية فقط',multi:'متعدد اللغات (العربية والإنجليزية والفرنسية وغيرها)'}};\nconst stacks={desktop:'Qt/PySide or .NET/WPF; GDAL, PROJ; optional Cesium for 3D',pro:'ArcGIS Pro Python 3, ArcPy, .pyt/.atbx',arcmap:'Legacy ArcMap Python 2.7, ArcPy, .pyt/.tbx',dual:'Isolated ArcMap Python 2.7 and ArcGIS Pro Python 3 adapters; shared compatible logic only',qgis:'PyQGIS and Qt; plugin metadata and packaging',web:'MapLibre GL JS, optional Cesium, standards-based geospatial services',remote:'GDAL, rasterio, xarray and documented data provenance',database:'PostGIS, spatial indexes and migration scripts',geoai:'Python geospatial ML stack with reproducible data and model validation'};
function translate(){document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';const t=dict[ar?'ar':'en'];[...$('locale').options].forEach(o=>o.textContent=localeLabels[ar?'ar':'en'][o.value]);Object.keys(t).forEach(k=>{if($(k))$(k).textContent=t[k]});$('details').placeholder=t.placeholder;for(const id of ['files','license']){const s=$(id);[...s.options].forEach(o=>o.textContent=t[o.value])}}
$('lang').onclick=()=>{ar=!ar;translate()};
$('generate').onclick=()=>{const t=$('type'),kind=t.options[t.selectedIndex].textContent,description=$('details').value.trim()||'To be specified',kml=$('files').value==='yes',commercial=$('license').value==='host';
output=['# GIS Project Implementation Plan','', '## Target',kind,'','## Requirements',description,'','## Suggested stack',stacks[t.value],'','## Languages and localization',$('locale').value==='en'?'English LTR; keep translation-ready resources.':'Apply Arabic RTL/BiDi, Unicode data and map-label tests; see skills/gis-internationalization-arabic/SKILL.md.','', '## Licensing',commercial?'Commercial host permitted; verify licenses and offer free alternatives.':'Prefer free/open-source libraries and free-to-use datasets; disclose commercial host dependencies.','','## Implementation phases','1. Requirements, data formats and acceptance criteria','2. Architecture, CRS, data model and project scaffolding','3. Incremental implementation and error handling','4. Functional, interoperability and performance tests','5. Packaging, documentation and release checks','','## Performance and crash-prevention acceptance','- Define representative and extreme input sizes, memory and processing budgets.','- Implement progress, cancellation, structured logs and cleanup.','- Run load, stress, soak, malformed-input and recovery tests.','- Record measured results; do not claim untested host compatibility.','','## KML/KMZ',kml?'Implement secure ZIP/XML handling, geometry and style fidelity report, overlays, altitude, folders and cross-host round-trip fixtures. See skills/kml-kmz-engineering/SKILL.md.':'Not selected; add when file interchange is required.','','## AI agent instructions','Read skills/gis-development/SKILL.md, references/agent-decision-tree.md, docs/PERFORMANCE_RELIABILITY.md'+($('locale').value!=='en'?', skills/gis-internationalization-arabic/SKILL.md':'')+(kml?', skills/kml-kmz-engineering/SKILL.md':'')+'. Implement incrementally; distinguish tested results from assumptions.','','## Acceptance','- All declared functionality passes relevant automated checks.','- Native GIS host compatibility is verified separately when available.','- Document unsupported formats/features and resource limits.'].join('\n');$('result').textContent=output;$('download').disabled=false};
$('download').onclick=()=>{if(!output)return;const url=URL.createObjectURL(new Blob([output],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='gis-project-plan.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};translate();
</script></body></html>
